[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiowac"
version = "0.1.0"
description = "Asyncio configurator for Apple's Wireless Accessory Configuration (WAC) protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
]

[project.optional-dependencies]
cli = ["zeroconf>=0.132"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "zeroconf>=0.132"]

[project.scripts]
aiowac = "aiowac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
