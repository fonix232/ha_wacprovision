name: Release

# Run from the Actions tab: picks the next version, stamps it everywhere, tags it, and
# publishes aiowac to PyPI and the integration zip to a GitHub release (which HACS installs).
#
# One-time setup:
#   - PyPI: add a trusted publisher for project "aiowac": this repository, workflow
#     "release.yml", environment "pypi".
#   - GitHub: create the "pypi" environment (Settings -> Environments).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Stamp version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: bump
        run: |
          python3 scripts/version.py check
          version=$(python3 scripts/version.py bump "${{ inputs.bump }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/aiowac/pyproject.toml custom_components/wac_provision/manifest.json
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main "v${{ steps.bump.outputs.version }}"

  build:
    name: Build packages
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build python/aiowac --outdir dist/
      - name: Zip the integration for HACS
        run: cd custom_components/wac_provision && zip -r "$GITHUB_WORKSPACE/dist/wac_provision.zip" . -x '__pycache__/*'
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish aiowac to PyPI
    needs: [tag, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - run: rm dist/wac_provision.zip
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [tag, build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.tag.outputs.version }}" dist/*
          --repo "${{ github.repository }}" --title "v${{ needs.tag.outputs.version }}" --generate-notes
